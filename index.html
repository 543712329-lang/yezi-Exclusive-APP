<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts for cute aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tone.js for soft soothing sound effects without external audio assets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Canvas Confetti for celebrating completed tasks -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans SC"', '"Comfortaa"', 'sans-serif'],
            cute: ['"Comfortaa"', 'cursive', 'sans-serif'],
          },
          colors: {
            sakura: { 50: '#fff5f7', 100: '#ffe4ea', 200: '#ffccd8', 300: '#fba5b8', 400: '#f87394', 500: '#ee4773' },
            cream: { 50: '#fffdf5', 100: '#fff9db', 200: '#fff3b8', 300: '#ffe682', 400: '#ffd64d' },
            mint: { 50: '#f2fcf7', 100: '#ddf7ea', 200: '#bcf0d6', 300: '#8fe4bd', 400: '#53ce98' },
            morandi: { 50: '#faf7fc', 100: '#f2e8fa', 200: '#e4d3f5', 300: '#cbb0eb', 400: '#af8add' },
            oatmeal: { 50: '#faf9f6', 100: '#f4f1ea', 200: '#e8e2d5', 300: '#d7cdb9', 400: '#c2b49c' },
            peach: { 50: '#fff6f2', 100: '#ffebd8', 200: '#ffd3b8', 300: '#ffb594', 400: '#ff8f66' },
          },
          boxShadow: {
            'soft': '0 12px 35px -8px rgba(180, 150, 170, 0.22)',
            'paper': '0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04)',
            'float': '0 20px 40px -10px rgba(220, 160, 190, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      user-select: none;
      overflow: hidden;
    }
    
    /* Scrollbar customization */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(220, 180, 200, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(220, 180, 200, 0.7);
    }

    /* Washi tape effect */
    .washi-tape {
      background: rgba(255, 230, 235, 0.75);
      border-left: 2px dashed rgba(230, 170, 190, 0.5);
      border-right: 2px dashed rgba(230, 170, 190, 0.5);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      backdrop-filter: blur(2px);
    }

    /* Wave border shape */
    .wave-border {
      border-radius: 28px 12px 28px 14px;
    }

    /* Polaroid photo frame style */
    .polaroid-frame {
      border-top: 14px solid #ffffff;
      border-left: 14px solid #ffffff;
      border-right: 14px solid #ffffff;
      border-bottom: 38px solid #ffffff;
      box-shadow: 0 15px 35px rgba(100, 90, 110, 0.15);
    }

    /* Hand drawn paper style */
    .hand-drawn-paper {
      border-radius: 4px;
      border: 1.5px solid rgba(210, 195, 180, 0.6);
      background-image: radial-gradient(rgba(200, 180, 160, 0.12) 1px, transparent 0);
      background-size: 16px 16px;
    }

    /* Privacy blur mode */
    .privacy-blurred .note-content-area {
      filter: blur(7px);
      transition: filter 0.25s ease;
    }

    /* Custom Checkbox animations */
    .check-bounce {
      animation: checkBounce 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes checkBounce {
      0% { transform: scale(0.65); }
      60% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }

    /* Gentle floating animation for widgets */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }
    .animate-gentle-float {
      animation: gentleFloat 4s ease-in-out infinite;
    }

    /* Resizing handles styling */
    .resize-handle-r {
      position: absolute;
      top: 10px;
      right: -4px;
      width: 10px;
      bottom: 10px;
      cursor: ew-resize;
      z-index: 35;
      touch-action: none;
    }
    .resize-handle-b {
      position: absolute;
      left: 10px;
      bottom: -4px;
      right: 10px;
      height: 10px;
      cursor: ns-resize;
      z-index: 35;
      touch-action: none;
    }
    .resize-handle-se {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 36;
      touch-action: none;
    }
    .resize-corner-indicator {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      opacity: 0.3;
      border-right: 2px solid #aaa;
      border-bottom: 2px solid #aaa;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .group:hover .resize-corner-indicator {
      opacity: 0.8;
    }
  </style>
</head>

<body class="h-screen w-screen relative overflow-hidden bg-slate-100 select-none">

  </header>

  <main id="desktop-canvas" class="relative w-full h-[calc(100vh-3.5rem)] overflow-hidden">

    <div class="absolute bottom-5 right-6 z-10 hidden md:flex flex-col items-end pointer-events-none select-none opacity-85">

      </div>

  <div id="note-drawer" class="fixed inset-y-0 right-0 z-50 w-80 sm:w-96 bg-white/95 backdrop-blur-xl shadow-2xl border-l border-pink-100 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    <div class="p-5 border-b border-pink-100 flex items-center justify-between bg-pink-50/50">

      <button onclick="filterDrawerNotes('work')" class="drawer-filter-btn text-xs px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-50 whitespace-nowrap">工作安排</button>
      <button onclick="filterDrawerNotes('life')" class="drawer-filter-btn text-xs px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-50 whitespace-nowrap">生活日常</button>
      <button onclick="filterDrawerNotes('study')" class="drawer-filter-btn text-xs px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-50 whitespace-nowrap">备考学习</button>
      <button onclick="filterDrawerNotes('wishlist')" class="drawer-filter-btn text-xs px-2.5 py-1 rounded-full bg-gray-100 text-gray-600 hover:bg-pink-50 whitespace-nowrap">愿望清单</button>
    </div>

    <!-- Drawer notes list -->

      <!-- Populated via JS -->
    </div>

    <!-- Drawer Footer Actions -->

      </button>
      <button onclick="createNewNote(); toggleDrawer();" class="text-xs bg-sakura-500 text-white px-3 py-1.5 rounded-full shadow hover:bg-sakura-600 transition flex items-center gap-1">
        <i class="fa-solid fa-plus text-[10px]"></i>
        <span>新建便签</span>
      </button>
    </div>
  </div>

  <div id="calendar-modal" class="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm hidden flex items-center justify-center p-4">

    let audioInitialized = false;
    let synth = null;
    let chimeSynth = null;

    function initAudio() {
      if (audioInitialized || typeof Tone === 'undefined') return;
      try {
        // Kalimba / Music box gentle synth
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'sine' },
          envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 0.8 }
        }).toDestination();
        synth.volume.value = -10;

        // Water drop / bubble chime synth
        chimeSynth = new Tone.MembraneSynth({
          pitchDecay: 0.05,
          octaves: 3,
          oscillator: { type: 'sine' },
          envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.4 }
        }).toDestination();
        chimeSynth.volume.value = -12;

        audioInitialized = true;
      } catch (err) {
        console.warn('Audio initialization deferred:', err);
      }
    }

    // Play checkmark sound
    function playCheckSound() {
      if (!state.soundEnabled) return;
      initAudio();
      try {
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        // Cute pleasant chord arpeggio (C5 -> E5 -> G5)
        const notes = ['C5', 'E5', 'G5'];
        const now = Tone.now();
        notes.forEach((note, i) => {
          synth.triggerAttackRelease(note, '8n', now + i * 0.06);
        });
      } catch (e) {}
    }

    // Play bubble pop sound
    function playBubbleSound() {
      if (!state.soundEnabled) return;
      initAudio();
      try {
        if (Tone.context.state !== 'running') Tone.start();
        chimeSynth.triggerAttackRelease('A4', '16n');
      } catch (e) {}
    }

    function createMiniWidgetElement(note) {
      const theme = THEMES[note.theme] || THEMES.sakura;
      const el = document.createElement('div');
      el.id = `widget-${note.id}`;
      el.className = `absolute z-20 cursor-pointer animate-gentle-float group`;
      el.style.left = `${note.x}px`;
      el.style.top = `${note.y}px`;

      const completed = note.items.filter(i => i.done).length;
      const total = note.items.length;

      el.innerHTML = `
        <div onclick="toggleMinimizeNote('${note.id}')" 
             class="relative px-3 py-2 rounded-2xl ${theme.bgClass} border-2 ${theme.borderClass} shadow-float backdrop-blur-md flex items-center gap-2 hover:scale-105 transition active:scale-95">
          <div class="w-7 h-7 rounded-xl bg-gradient-to-tr ${theme.gradient} text-white flex items-center justify-center text-xs shadow-sm">

            <p class="text-[11px] font-bold text-gray-800 truncate max-w-[90px]">${escapeHtml(note.title)}</p>
            <p class="text-[9px] text-sakura-500 font-mono">${completed}/${total} 已完成</p>
          </div>
          <!-- Click to restore icon -->
          <span class="text-gray-400 text-xs ml-1 group-hover:text-sakura-500">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </span>
        </div>
      `;

      attachDragListeners(el, note, true);
      return el;
    }

    function renderTodoItems(note) {
      if (!note.items || note.items.length === 0) {
        return `<div class="text-center py-4 text-xs text-gray-400 font-light">还没有待办事项，点击下方添加一条吧 ~</div>`;
      }

      const iconDef = CHECK_ICONS.find(c => c.id === note.checkIcon) || CHECK_ICONS[0];

      return note.items.map((item, index) => {
        return `
          <div class="flex items-center justify-between group/item py-1.5 px-2 rounded-xl hover:bg-white/75 transition ${
            item.done ? 'bg-pink-50/40 opacity-70' : 'bg-white/40'
          }">
            <!-- Click anywhere on row content to toggle completed state -->
            <div class="flex items-center gap-2.5 flex-1 min-w-0 cursor-pointer" onclick="toggleTaskDone('${note.id}', '${item.id}')" title="点击切换完成状态">
              <!-- Custom Aesthetic Checkbox -->
              <button type="button" onclick="event.stopPropagation(); toggleTaskDone('${note.id}', '${item.id}')" 
                      title="${item.done ? '点击标记为未完成' : '点击标记为已完成'}"
                      class="w-5 h-5 rounded-full flex items-center justify-center text-xs transition-all duration-200 active:scale-75 shadow-xs ${
                        item.done 
                          ? 'bg-sakura-400 text-white check-bounce shadow-sm shadow-pink-200' 
                          : 'border-2 border-pink-200/90 hover:border-sakura-400 bg-white text-transparent hover:text-sakura-300'
                      }">
                ${item.done ? (iconDef.emoji || '✓') : '<span class="text-[9px] opacity-0 group-hover/item:opacity-60 text-sakura-400">✓</span>'}
              </button>

              <!-- Task Text with strike-through when done -->
              <span class="text-xs select-text truncate transition-all duration-200 ${
                item.done ? 'line-through text-gray-400 italic' : 'text-gray-700 font-medium'
              }">
                ${escapeHtml(item.text)}
              </span>
            </div>

            <!-- Task meta: Reminder time badge, edit & delete -->
            <div class="flex items-center space-x-1.5 opacity-0 group-hover/item:opacity-100 transition">
              ${item.reminderTime ? `
                <span class="text-[9px] font-mono text-sakura-500 bg-pink-50 border border-pink-200/60 px-1 rounded flex items-center gap-0.5">
                  <i class="fa-regular fa-clock text-[8px]"></i>
                  ${item.reminderTime}
                </span>
              ` : `
                <button onclick="event.stopPropagation(); setTaskReminder('${note.id}', '${item.id}')" title="设置提醒时间" 
                        class="text-gray-400 hover:text-sakura-500 text-[10px]">
                  <i class="fa-regular fa-bell"></i>
                </button>
              `}
              <button onclick="event.stopPropagation(); editTaskPrompt('${note.id}', '${item.id}')" title="编辑文本"
                      class="text-gray-300 hover:text-sakura-500 text-xs">
                <i class="fa-solid fa-pen-to-square text-[11px]"></i>
              </button>
              <button onclick="event.stopPropagation(); deleteTask('${note.id}', '${item.id}')" title="删除该事项"
                      class="text-gray-300 hover:text-red-400 text-xs">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderNoteStickers(note) {
      if (!note.stickers || note.stickers.length === 0) return '';
      const positions = [
        'top-1 right-2 -rotate-12',
        'bottom-3 right-4 rotate-6',
        'top-8 -left-2 rotate-12',
        'bottom-8 -right-2 -rotate-6'
      ];
      return note.stickers.map((s, idx) => {
        const pos = positions[idx % positions.length];
        return `<span class="absolute ${pos} text-lg drop-shadow-sm select-none">${s}</span>`;
      }).join('');
    }

    function attachDragListeners(element, note, isWidget = false) {
      const handle = isWidget ? element : element.querySelector('.note-drag-handle');
      if (!handle) return;

      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;

      const onMouseDown = (e) => {
        if (note.locked) return; // Prevent drag if locked
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = note.x;
        initialTop = note.y;

        // Bring to front
        bringToFront(note.id);

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        const maxW = window.innerWidth - (isWidget ? 120 : 340);
        const maxH = window.innerHeight - (isWidget ? 60 : 250);

        note.x = Math.max(10, Math.min(maxW, initialLeft + dx));
        note.y = Math.max(10, Math.min(maxH, initialTop + dy));

        element.style.left = `${note.x}px`;
        element.style.top = `${note.y}px`;
      };

      const onMouseUp = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', onMouseDown);

      // Mobile touch support
      handle.addEventListener('touchstart', (e) => {
        if (note.locked) return;
        const touch = e.touches[0];
        isDragging = true;
        startX = touch.clientX;
        startY = touch.clientY;
        initialLeft = note.x;
        initialTop = note.y;
        bringToFront(note.id);
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        note.x = initialLeft + (touch.clientX - startX);
        note.y = initialTop + (touch.clientY - startY);
        element.style.left = `${note.x}px`;
        element.style.top = `${note.y}px`;
      }, { passive: true });

      handle.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    function attachResizeListeners(element, note) {
      if (note.locked) return;

      const handles = element.querySelectorAll('[data-resize]');
      handles.forEach(handle => {
        const direction = handle.getAttribute('data-resize');

        const onStart = (clientX, clientY) => {
          bringToFront(note.id);
          const startX = clientX;
          const startY = clientY;
          const initialWidth = note.width || element.offsetWidth || 340;
          const initialHeight = note.height || element.offsetHeight || 360;

          // Constraints
          const minW = 240;
          const maxW = Math.min(window.innerWidth - note.x - 20, 900);
          const minH = 200;
          const maxH = Math.min(window.innerHeight - note.y - 20, 800);

          const onMove = (curX, curY) => {
            const dx = curX - startX;
            const dy = curY - startY;

            if (direction === 'r' || direction === 'se') {
              const newW = Math.max(minW, Math.min(maxW, initialWidth + dx));
              note.width = newW;
              element.style.width = `${newW}px`;
            }
            if (direction === 'b' || direction === 'se') {
              const newH = Math.max(minH, Math.min(maxH, initialHeight + dy));
              note.height = newH;
              element.style.height = `${newH}px`;
            }
          };

          const onMouseMove = (e) => {
            onMove(e.clientX, e.clientY);
          };

          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);

          const onTouchMove = (e) => {
            if (e.touches.length > 0) {
              onMove(e.touches[0].clientX, e.touches[0].clientY);
            }
          };

          const onTouchEnd = () => {
            document.removeEventListener('touchmove', onTouchMove);
            document.removeEventListener('touchend', onTouchEnd);
          };

          document.addEventListener('touchmove', onTouchMove, { passive: true });
          document.addEventListener('touchend', onTouchEnd);
        };

        handle.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          onStart(e.clientX, e.clientY);
        });

        handle.addEventListener('touchstart', (e) => {
          e.stopPropagation();
          if (e.touches.length > 0) {
            onStart(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: false });
      });
    }

    function bringToFront(noteId) {
      const maxZ = Math.max(10, ...state.notes.map(n => n.zIndex || 10));
      const note = state.notes.find(n => n.id === noteId);
      if (note) {
        note.zIndex = maxZ + 1;
        const el = document.getElementById(`note-${noteId}`) || document.getElementById(`widget-${noteId}`);
        if (el) el.style.zIndex = note.zIndex;
      }
    }

      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      const item = note.items.find(i => i.id === taskId);
      if (!item) return;

      item.done = !item.done;

      if (item.done) {
        playCheckSound();
        // Check if all tasks in note are now completed!
        const allCompleted = note.items.length > 0 && note.items.every(i => i.done);
        if (allCompleted) {
          triggerCelebrationConfetti();
          showToast(`太棒啦！已完成便签「${note.title}」的全部事项 🌸`);
        }
      } else {
        playBubbleSound();

      renderAllNotes();
      updateDrawer();

      if (!note || note.items.length === 0) return;
      const allDone = note.items.every(i => i.done);
      note.items.forEach(i => i.done = !allDone);
      if (!allDone) {
        playCheckSound();
        triggerCelebrationConfetti();
        showToast(`太棒啦！已将「${note.title}」全部标记为已完成 🌸`);
      } else {

    function renderCalendar() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendar-days-grid');
      grid.innerHTML = '';

      // Blank prefix cells
      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="h-8"></div>`;
      }

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = isCurrentMonth && today.getDate() === day;
        const isSelected = state.selectedCalendarDay === day;

        // Count reminders on this day (mock checking reminder tags)
        const hasTasks = day % 3 === 0 || isToday; // demo active days

        grid.innerHTML += `
          <button onclick="selectCalendarDay(${day})" 
                  class="h-8 rounded-xl flex flex-col items-center justify-center transition relative ${
                    isSelected ? 'bg-sakura-500 text-white font-bold' : 
                    isToday ? 'bg-pink-100 text-sakura-600 font-bold' : 'text-gray-700 hover:bg-pink-50'
                  }">
            <span>${day}</span>
            ${hasTasks ? `<span class="w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-sakura-400'} -mt-0.5"></span>` : ''}
          </button>
        `;
      }

      updateCalendarTasksList(state.selectedCalendarDay);
    }

    function selectCalendarDay(day) {
      state.selectedCalendarDay = day;
      renderCalendar();
    }

    function updateCalendarTasksList(day) {
      const label = document.getElementById('selected-date-label');
      label.innerText = `${state.calendarDate.getMonth() + 1}月${day}日 关联日程`;

      const preview = document.getElementById('calendar-tasks-preview');
      // Aggregate all active tasks across all notes
      const allTasks = [];
      state.notes.forEach(note => {
        note.items.forEach(t => {
          allTasks.push({ ...t, noteTitle: note.title });
        });
      });

      document.getElementById('selected-date-count').innerText = `${allTasks.length} 项日程`;

      if (allTasks.length === 0) {
        preview.innerHTML = `<div class="text-center py-2 text-gray-400">今日暂无日程安排</div>`;
        return;
      }

      preview.innerHTML = allTasks.map(t => `
        <div class="flex items-center justify-between p-1.5 bg-pink-50/60 rounded-lg">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full ${t.done ? 'bg-emerald-400' : 'bg-sakura-400'}"></span>
            <span class="${t.done ? 'line-through text-gray-400' : 'text-gray-700'}">${escapeHtml(t.text)}</span>
          </div>
          <span class="text-[10px] text-gray-400">${escapeHtml(t.noteTitle)}</span>
        </div>
      `).join('');
    }

      overlay.innerHTML = `
        <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-2xl border border-pink-100 flex flex-col">
          <h4 class="font-bold text-gray-800 text-xs mb-2">${escapeHtml(title)}</h4>
          <input type="text" id="custom-prompt-input" value="${escapeHtml(defaultValue)}" class="w-full text-xs p-2.5 rounded-xl border border-pink-200 outline-none focus:border-sakura-400 bg-pink-50/30 mb-4" />
          <div class="flex gap-2">
            <button id="prompt-ok-btn" class="flex-1 py-1.5 bg-sakura-500 text-white rounded-xl text-xs font-medium hover:bg-sakura-600 transition">确定</button>
            <button id="prompt-cancel-btn" class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-xl text-xs hover:bg-gray-200 transition">取消</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector('#custom-prompt-input');
      input.focus();
      input.select();

      const cleanup = () => overlay.remove();
      overlay.querySelector('#prompt-cancel-btn').onclick = cleanup;
      overlay.querySelector('#prompt-ok-btn').onclick = () => {
        onConfirm(input.value);
        cleanup();
      };
      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          onConfirm(input.value);
          cleanup();
        } else if (e.key === 'Escape') {
          cleanup();
        }
      };
    }

    function getCategoryName(catId) {
      const cat = CATEGORIES.find(c => c.id === catId);
      return cat ? cat.label : '日常便签';
    }

    function getCompletionRatioText(note) {
      const total = note.items.length;
      if (total === 0) return '暂无事项';
      const done = note.items.filter(i => i.done).length;
      return `${done}/${total} 已完成`;
    }

    function getCompletionPercentage(note) {
      const total = note.items.length;
      if (total === 0) return 0;
      const done = note.items.filter(i => i.done).length;
      return Math.round((done / total) * 100);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('keydown', (e) => {
      // Alt + N: Create note
      if (e.altKey && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        createNewNote();
      }
      // Alt + P: Privacy blur toggle
      if (e.altKey && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        togglePrivacyMode();
      }
    });

    function updateDesktopClock() {
      const now = new Date();
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const day = days[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('desktop-clock-display');
      if (clockEl) {
        clockEl.innerText = `${year}.${month}.${date} ${day} ${hours}:${mins}`;
      }
    }

    window.onload = function() {
      initializeDefaultNotes();
      updateDesktopClock();
      setInterval(updateDesktopClock, 30000);
    };
  </script>
</body>
</html>
